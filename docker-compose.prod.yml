

services:
  mermaid:
    build:
      context: .
      target: mermaid
      args:
        - MERMAID_RENDERER_URL=https://mermaid.ink
        - MERMAID_KROKI_RENDERER_URL=https://kroki.io
        - MERMAID_ANALYTICS_URL=
        - MERMAID_DOMAIN=
        - MERMAID_IS_ENABLED_MERMAID_CHART_LINKS=true
        - MERMAID_PRIVACY_POLICY_URL=
        - MERMAID_HIDE_PRIVACY_POLICY=
        - MERMAID_BASE_PATH=
    container_name: mermaid-app
    ports:
      - "8510:8080"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "ollama-host:172.27.111.234"
    networks:
      - mermaid-network

  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    container_name: mermaid-cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run --protocol http2
    volumes:
      - /mnt/e/cf_config/mermaid:/etc/cloudflared:ro
    depends_on:
      - mermaid
    networks:
      - mermaid-network

networks:
  mermaid-network:
    driver: bridge
